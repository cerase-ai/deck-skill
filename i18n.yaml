# Registry display text in the platform's other locales.
#
# The base fields -- SKILL.md's `description` and cerase.json's -- are the SOURCE
# locale and are English; package_translations forbids a row for it, so this file
# can only ever hold the others. It is registry metadata: the seeder keeps it out
# of the bundle that ships to the agent.
it:
  display_name: "Deck"
  description: "Costruisce una presentazione in cinque passi: un brief, una bozza, un primo render, una revisione del deck stampato su otto controlli, e il render finale. La consegna in HTML o PDF, oppure tramite le skill pptx o docx come PowerPoint, OpenDocument, Google Slides o Word. Da usare quando la persona chiede una presentazione, delle slide, un deck o un pitch."
